name: Build public runtime image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/morphinic10/h3-runpod-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_repo.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  smoke-container-start:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull the published image anonymously
        run: docker pull "${IMAGE_NAME}:sha-${GITHUB_SHA}"
      - name: Verify the baked startup contract
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          test "$(docker image inspect "$image" --format '{{json .Config.Entrypoint}}')" = '["/usr/bin/tini","--","/usr/local/bin/entrypoint.sh"]'
          docker run --detach --name h3-runtime-smoke \
            --publish 8188:8188 \
            --publish 8189:8189 \
            --env H3_DOWNLOAD_MODELS=0 \
            --env H3_CUDA_RETRIES=1 \
            --env H3_CUDA_RETRY_DELAY_S=0 \
            "$image"
          trap 'docker logs h3-runtime-smoke || true; docker rm --force h3-runtime-smoke || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8188/status.json > /tmp/status.json \
              && curl --fail --silent http://127.0.0.1:8189/launch.log > /tmp/launch.log \
              && grep -q '"state": "failed"' /tmp/status.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          grep -q 'clean H3 runtime starting' /tmp/launch.log
          grep -q 'direct CUDA driver probe 1/1' /tmp/launch.log
          grep -q 'keeping diagnostic endpoints alive' /tmp/launch.log
      - uses: actions/checkout@v4
      - name: Start real ComfyUI and check every required node on CPU
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker run --detach --name h3-comfy-smoke \
            --publish 8188:8188 --publish 8189:8189 \
            --env H3_DOWNLOAD_MODELS=0 --env H3_DEVICE=cpu \
            "$image"
          trap 'docker logs h3-comfy-smoke || true; docker rm --force h3-comfy-smoke || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8188/system_stats > /tmp/system-stats.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          python3 scripts/preflight.py --url http://127.0.0.1:8188 --allow-cpu
          docker exec h3-comfy-smoke python -m pip check
